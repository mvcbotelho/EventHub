spring:
  datasource:
    url: jdbc:h2:mem:eventhub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

eventhub:
  jwt:
    secret: test-secret-key-for-unit-tests-must-be-at-least-256-bits-long
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  rate-limit:
    enabled: false
  mail:
    enabled: false

management:
  health:
    mail:
      enabled: false
