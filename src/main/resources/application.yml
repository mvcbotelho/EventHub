spring:
  application:
    name: eventhub-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventhub}
    username: ${SPRING_DATASOURCE_USERNAME:eventhub}
    password: ${SPRING_DATASOURCE_PASSWORD:eventhub}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    try-it-out-enabled: true
    use-root-path: true

logging:
  level:
    org.springframework.web: INFO
    com.marcus.eventhub: DEBUG

eventhub:
  jwt:
    secret: ${JWT_SECRET:change-me-use-a-long-secret-key-for-development-only-256bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

