spring:
  application:
    name: eventhub-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventhub}
    username: ${SPRING_DATASOURCE_USERNAME:eventhub}
    password: ${SPRING_DATASOURCE_PASSWORD:eventhub}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    try-it-out-enabled: true
    use-root-path: true
    operations-sorter: method
    tags-sorter: alpha
  default-flat-param-object: true

logging:
  level:
    org.springframework.web: INFO
    com.marcus.eventhub: DEBUG

eventhub:
  jwt:
    secret: ${JWT_SECRET:change-me-use-a-long-secret-key-for-development-only-256bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
    auth-refill-per-minutes: ${RATE_LIMIT_AUTH_REFILL_MINUTES:1}
    registration-capacity: ${RATE_LIMIT_REGISTRATION_CAPACITY:30}
    registration-refill-per-minutes: ${RATE_LIMIT_REGISTRATION_REFILL_MINUTES:1}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@eventhub.local}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
